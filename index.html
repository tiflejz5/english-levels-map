<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Motyw jasny i ciemny (kolory w css/style.css, przełącznik w js/theme.js) -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6ee">
  <title>English Levels Map (A1–C2)</title>
  <!-- Ustawia motyw i stan lewego panelu ZANIM strona się narysuje.
       elm_theme_v1: "auto" (jak w systemie), "light" albo "dark".
       elm_sidebar_v1: { version: 1, pinned: true|false } (js/sidebar.js). -->
  <script>
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("elm_theme_v1") || "auto"; } catch (e) {}
      var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var root = document.documentElement;
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.setAttribute("data-theme-pref", pref);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0e1526" : "#faf6ee");
      // Lewy panel przypięty? (elm_sidebar_v1, globalnie dla urządzenia) — przed narysowaniem,
      // żeby treść nie przeskakiwała przy starcie
      var pinned = false;
      try { var sb = JSON.parse(localStorage.getItem("elm_sidebar_v1") || "null"); pinned = !!(sb && sb.version === 1 && sb.pinned === true); } catch (e) {}
      root.setAttribute("data-sidebar", pinned ? "pinned" : "rail");
    })();
  </script>
  <!-- Fonty self-hosted (assets/fonts): preload tylko krytycznych plików i tylko przez http(s) —
       z file:// preload „crossorigin” jest blokowany (błędy w konsoli), a fonty i tak wczytuje CSS -->
  <script>
    if (/^https?:$/.test(location.protocol)) {
      ["inter-latin", "inter-latin-ext", "fraunces-latin"].forEach(function (f) {
        var l = document.createElement("link");
        l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
        l.href = "assets/fonts/" + f + ".woff2";
        document.head.appendChild(l);
      });
    }
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-180.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="css/style.css?v=127">
  <link rel="stylesheet" href="css/print.css?v=127" media="print">
</head>
<body>
  <noscript>
    <p class="noscript">Ta strona wymaga włączonej obsługi JavaScript w przeglądarce.</p>
  </noscript>

  <div class="app" id="app">
    <!-- LEWY PANEL (js/sidebar.js, DESIGN.md sekcja 3.1):
         wąski pasek (72 px) rozwijany nad treścią po najechaniu / fokusie / dotknięciu,
         przypinany pinezką; poniżej 768 px szuflada otwierana przyciskiem „Menu”. -->
    <aside class="sidebar" id="sidebar" aria-label="Nawigacja">
      <div class="sb-panel" id="sb-panel">
        <div class="sb-head">
          <!-- Logo: link do strony głównej (#/) z każdego miejsca -->
          <a class="brand sb-brand" href="#/" aria-label="English Levels Map – strona główna" data-logo></a>
          <button type="button" class="icon-btn sb-toggle" id="sb-toggle" aria-controls="sb-panel" aria-expanded="false" aria-label="Rozwiń panel"><span data-icon="panel-left-open"></span></button>
        </div>
        <p class="sb-tagline" id="sidebar-category-name">Mapa angielskiego A1–C2</p>

        <div class="sb-scroll">
          <!-- Narzędzia nauki (Dziś, Test poziomu, Dziennik błędów) rysuje js/render.js -->
          <nav class="sb-nav" id="tools-nav" aria-label="Nauka"></nav>

          <!-- Poziomy A1–C2 (postęp we wszystkich kategoriach) rysuje js/render.js -->
          <p class="sb-caption" id="sb-levels-caption">Poziomy · wszystkie kategorie</p>
          <nav class="sb-nav level-list" id="level-list" aria-labelledby="sb-levels-caption"></nav>

          <!-- Zakładka „Certyfikat C1” (sekcje z manifest.json) rysuje js/c1-core.js -->
          <!-- Grupa „Egzaminy” z rejestru dane/egzaminy-manifest.json (js/exam-core.js): aktywne egzaminy,
               pod nimi Certyfikat C1, na końcu egzaminy „w trakcie pracy” -->
          <nav class="sb-nav exams-nav" id="exams-nav" aria-labelledby="sb-exams-caption"></nav>
          <nav class="sb-nav c1-nav" id="c1-nav" aria-label="Certyfikat C1"></nav>
          <nav class="sb-nav exams-nav exams-soon-nav" id="exams-soon-nav" aria-label="Egzaminy w trakcie pracy"></nav>
        </div>

        <div class="sb-foot">
          <button type="button" class="sb-item sb-pin" id="sb-pin" aria-pressed="false">
            <span class="sb-icon" aria-hidden="true"><span data-icon="pin"></span></span>
            <span class="sb-label">Przypnij panel</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- PRAWA CZĘŚĆ: treść wybranego poziomu -->
    <main class="main" id="main" tabindex="-1">
      <!-- Górny pasek: przycisk menu (tylko telefon) i menu profilu z sekcją „Dane” (prawy górny róg, js/profiles.js) -->
      <div class="topbar" id="topbar">
        <button type="button" class="btn btn-secondary btn-small menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span>Menu</button>
        <div class="topbar-actions">
          <!-- Motyw: Automatycznie → Jasny → Ciemny (js/theme.js) -->
          <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Motyw"></button>
          <div class="profile-slot" id="profile-slot"></div>
        </div>
      </div>
      <div class="banners" id="banners"></div>
      <div class="view" id="view"></div>
    </main>
  </div>
  <!-- Tło za otwartym menu na telefonie (kliknięcie zamyka menu) -->
  <div class="nav-overlay" id="nav-overlay" hidden></div>

  <!-- Skrypty ładowane po kolei (bez modułów ES, żeby działało z file://).
       ?v=127 to numer wersji: po zmianie plików JS/CSS zwiększ go wszędzie,
       żeby przeglądarki nie użyły starych kopii z pamięci podręcznej. -->
  <script defer src="js/utils.js?v=127"></script>
  <!-- Ikony Lucide (generowane: npm run zasoby) i wspólne elementy wizualne -->
  <script defer src="assets/ikony.js?v=127"></script>
  <script defer src="assets/krainy.js?v=127"></script>
  <script defer src="assets/stany-puste.js?v=127"></script>
  <script defer src="js/ui.js?v=127"></script>
  <script defer src="js/motion.js?v=127"></script>
  <!-- Czysta logika nauki: powtórki, seria, test poziomu (testy: node tools/testy.js) -->
  <script defer src="js/learning.js?v=127"></script>
  <script defer src="js/theme.js?v=127"></script>
  <script defer src="js/print.js?v=127"></script>
  <script defer src="js/default-data.js?v=127"></script>
  <!-- Bazowa lista umiejętności; usuń tę linię, aby startować od pustego szkieletu -->
  <script defer src="js/base-content.js?v=127"></script>
  <script defer src="js/store.js?v=127"></script>
  <script defer src="js/dialogs.js?v=127"></script>
  <script defer src="js/render.js?v=127"></script>
  <script defer src="js/profiles.js?v=127"></script>
  <script defer src="js/markdown.js?v=127"></script>
  <!-- Wyróżnione sekcje (callouty) i tabele w treściach -->
  <script defer src="js/callouts.js?v=127"></script>
  <script defer src="js/niezbednik.js?v=127"></script>
  <!-- Podstrony niezbędnika (generowane: node tools/zbuduj-niezbednik.js) -->
  <script defer src="niezbednik/niezbednik-dane.js?v=127"></script>
  <!-- Zakładka „Certyfikat C1” (dane generowane tym samym skryptem) -->
  <script defer src="niezbednik/certyfikat-c1-dane.js?v=127"></script>
  <script defer src="js/c1-core.js?v=127"></script>
  <script defer src="js/c1-exercises.js?v=127"></script>
  <!-- Wspólny silnik trenera pisania (C1, Egzamin ósmoklasisty) -->
  <script defer src="js/writing-trainer.js?v=127"></script>
  <script defer src="js/c1-writing.js?v=127"></script>
  <!-- Trener Speaking egzaminów z rejestru (B2 First): timery, samoocena, historia sesji -->
  <script defer src="js/c1-speaking.js?v=127"></script>
  <!-- Egzaminy z rejestru: rejestr (mały, przy starcie), logika i moduł; treści egzaminu ładowane na żądanie -->
  <script defer src="dane/egzaminy-rejestr.js?v=127"></script>
  <script defer src="js/exam-logic.js?v=127"></script>
  <script defer src="js/exam-core.js?v=127"></script>
  <script defer src="js/exam-ui.js?v=127"></script>
  <!-- Dane nauki osobno dla każdego profilu i dziennik błędów -->
  <!-- Czysta logika dziennika podejść i statystyk (przed profile-data.js, które z niej korzysta) -->
  <script defer src="js/learning-stats.js?v=127"></script>
  <script defer src="js/profile-data.js?v=127"></script>
  <!-- Fiszki: harmonogram i czysta logika (testy: node tools/testy.js), zapis elm.<profil>.fiszki -->
  <script defer src="js/fiszki-harmonogram.js?v=127"></script>
  <script defer src="js/fiszki-logic.js?v=127"></script>
  <script defer src="js/fiszki-store.js?v=127"></script>
  <!-- Indeks talii (mały; same talie ładowane na żądanie z dane/fiszki/talie/) i zakładka /fiszki -->
  <script defer src="dane/fiszki/fiszki-indeks.js?v=127"></script>
  <script defer src="js/fiszki.js?v=127"></script>
  <script defer src="js/fiszki-browse.js?v=127"></script>
  <script defer src="js/fiszki-words.js?v=127"></script>
  <!-- Fiszki i błędy: jedna kolejka (reviews.js, czysta logika) i widok #/powtorki (powtorki.js) -->
  <script defer src="js/reviews.js?v=127"></script>
  <script defer src="js/powtorki.js?v=127"></script>
  <!-- Pisanie: wzorcowe wypracowania z komentarzami (dane z trenerów pisania ładowane na żądanie) -->
  <script defer src="js/pisanie.js?v=127"></script>
  <script defer src="js/journal.js?v=127"></script>
  <!-- Silnik zadań (logika bez DOM + widok); dane ćwiczeń ładowane na żądanie z cwiczenia/ -->
  <script defer src="js/exercise-logic.js?v=127"></script>
  <script defer src="js/final-logic.js?v=127"></script>
  <script defer src="js/exercise-engine.js?v=127"></script>
  <script defer src="js/exercise-hub.js?v=127"></script>
  <script defer src="js/level-final.js?v=127"></script>
  <!-- Laboratorium czasów (dane/lab-dane.js ładowane na żądanie) -->
  <script defer src="js/tense-lab.js?v=127"></script>
  <!-- Statystyki (dziennik podejść, js/learning-stats.js) -->
  <script defer src="js/stats-page.js?v=127"></script>
  <!-- Wyszukiwarka (indeks dane/szukaj-indeks.js ładowany przy pierwszym otwarciu) -->
  <script defer src="js/search-logic.js?v=127"></script>
  <script defer src="js/search.js?v=127"></script>
  <!-- Własne notatki (panel na stronach z treścią, #/notatki) -->
  <script defer src="js/notes.js?v=127"></script>
  <script defer src="js/today.js?v=127"></script>
  <!-- Szybki test poziomu (pytania generowane: node tools/zbuduj-niezbednik.js) -->
  <script defer src="js/level-test.js?v=127"></script>
  <script defer src="js/data-menu.js?v=127"></script>
  <script defer src="js/sidebar.js?v=127"></script>
  <!-- Celebracje kamieni milowych (GSAP na żądanie) -->
  <script defer src="js/celebrate.js?v=127"></script>
  <script defer src="js/app.js?v=127"></script>
</body>
</html>

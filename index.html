<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Motyw jasny i ciemny (kolory w css/style.css, przełącznik w js/theme.js) -->
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf6ee">
  <title>English Levels Map (A1–C2)</title>
  <!-- Ustawia motyw ZANIM strona się narysuje (bez błysku złego motywu).
       elm_theme_v1: "auto" (jak w systemie), "light" albo "dark". -->
  <script>
    (function () {
      var pref = "auto";
      try { pref = localStorage.getItem("elm_theme_v1") || "auto"; } catch (e) {}
      var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      var root = document.documentElement;
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.setAttribute("data-theme-pref", pref);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0e1526" : "#faf6ee");
    })();
  </script>
  <!-- Fonty self-hosted (assets/fonts): preload tylko krytycznych plików -->
  <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/inter-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-180.png" type="image/png" sizes="180x180">
  <link rel="apple-touch-icon" href="assets/favicon-180.png">
  <link rel="stylesheet" href="css/style.css?v=32">
</head>
<body>
  <noscript>
    <p class="noscript">Ta strona wymaga włączonej obsługi JavaScript w przeglądarce.</p>
  </noscript>

  <div class="app" id="app">
    <!-- LEWY PASEK: logo, lista poziomów i zakładka „Certyfikat C1” -->
    <aside class="sidebar" id="sidebar" aria-label="Poziomy i ustawienia">
      <div class="sidebar-brand">
        <!-- Logo: link do strony głównej (#/) z każdego miejsca -->
        <a class="brand" href="#/" title="Strona główna" aria-label="English Levels Map – strona główna" data-logo></a>
        <div class="brand-sub" id="sidebar-category-name"></div>
      </div>

      <!-- Narzędzia nauki (Dziś, Test poziomu, Dziennik błędów) rysuje js/render.js -->
      <nav class="tools-nav" id="tools-nav" aria-label="Nauka"></nav>

      <!-- Przyciski poziomów A1–C2 rysuje js/render.js -->
      <nav class="level-list" id="level-list" aria-label="Lista poziomów"></nav>

      <!-- Zakładka „Certyfikat C1” (sekcje z manifest.json) rysuje js/c1-core.js -->
      <nav class="c1-nav" id="c1-nav" aria-label="Certyfikat C1"></nav>

    </aside>

    <!-- PRAWA CZĘŚĆ: treść wybranego poziomu -->
    <main class="main" id="main" tabindex="-1">
      <!-- Górny pasek: przycisk menu (tylko telefon) i menu profilu z sekcją „Dane” (prawy górny róg, js/profiles.js) -->
      <div class="topbar" id="topbar">
        <button type="button" class="btn btn-secondary btn-small menu-btn" id="menu-btn" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span>Menu</button>
        <div class="topbar-actions">
          <!-- Motyw: Automatycznie → Jasny → Ciemny (js/theme.js) -->
          <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="Motyw"></button>
          <div class="profile-slot" id="profile-slot"></div>
        </div>
      </div>
      <div class="banners" id="banners"></div>
      <div class="view" id="view"></div>
    </main>
  </div>
  <!-- Tło za otwartym menu na telefonie (kliknięcie zamyka menu) -->
  <div class="nav-overlay" id="nav-overlay" hidden></div>

  <!-- Skrypty ładowane po kolei (bez modułów ES, żeby działało z file://).
       ?v=32 to numer wersji: po zmianie plików JS/CSS zwiększ go wszędzie,
       żeby przeglądarki nie użyły starych kopii z pamięci podręcznej. -->
  <script src="js/utils.js?v=32"></script>
  <!-- Ikony Lucide (generowane: npm run zasoby) i wspólne elementy wizualne -->
  <script src="assets/ikony.js?v=32"></script>
  <script src="js/ui.js?v=32"></script>
  <!-- Czysta logika nauki: powtórki, seria, test poziomu (testy: node tools/testy.js) -->
  <script src="js/learning.js?v=32"></script>
  <script src="js/theme.js?v=32"></script>
  <script src="js/default-data.js?v=32"></script>
  <!-- Bazowa lista umiejętności; usuń tę linię, aby startować od pustego szkieletu -->
  <script src="js/base-content.js?v=32"></script>
  <script src="js/store.js?v=32"></script>
  <script src="js/dialogs.js?v=32"></script>
  <script src="js/render.js?v=32"></script>
  <script src="js/profiles.js?v=32"></script>
  <script src="js/markdown.js?v=32"></script>
  <script src="js/niezbednik.js?v=32"></script>
  <!-- Podstrony niezbędnika (generowane: node tools/zbuduj-niezbednik.js) -->
  <script src="niezbednik/niezbednik-dane.js?v=32"></script>
  <!-- Zakładka „Certyfikat C1” (dane generowane tym samym skryptem) -->
  <script src="niezbednik/certyfikat-c1-dane.js?v=32"></script>
  <script src="js/c1-core.js?v=32"></script>
  <script src="js/c1-exercises.js?v=32"></script>
  <script src="js/c1-writing.js?v=32"></script>
  <script src="js/c1-speaking.js?v=32"></script>
  <!-- Dane nauki osobno dla każdego profilu i dziennik błędów -->
  <script src="js/profile-data.js?v=32"></script>
  <script src="js/journal.js?v=32"></script>
  <script src="js/today.js?v=32"></script>
  <!-- Szybki test poziomu (pytania generowane: node tools/zbuduj-niezbednik.js) -->
  <script src="niezbednik/test-poziomu-dane.js?v=32"></script>
  <script src="js/level-test.js?v=32"></script>
  <script src="js/data-menu.js?v=32"></script>
  <script src="js/app.js?v=32"></script>
</body>
</html>

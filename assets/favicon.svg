<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Favicon English Levels Map: kompas ze szlakiem w kolorach krain A1 → C2.
       Plik samodzielny (poza aplikacją), więc kolory są wpisane na stałe —
       te same wartości co tokeny --lvl-a1 … --lvl-c2 (jasny) i --ink. -->
  <defs>
    <linearGradient id="g" x1="4" y1="36" x2="36" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18b350"/>
      <stop offset="0.2" stop-color="#2a9df2"/>
      <stop offset="0.4" stop-color="#8b5fd6"/>
      <stop offset="0.6" stop-color="#d44a82"/>
      <stop offset="0.8" stop-color="#f08a24"/>
      <stop offset="1" stop-color="#17b3b3"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="#1d2433"/>
  <circle cx="20" cy="20" r="14.5" fill="none" stroke="url(#g)" stroke-width="2.6"/>
  <g transform="rotate(40 20 20)">
    <path d="M20 9.5 23 20h-6z" fill="url(#g)"/>
    <path d="M20 30.5 17 20h6z" fill="#6d7a99"/>
  </g>
  <circle cx="20" cy="20" r="2" fill="#1d2433"/>
</svg>
